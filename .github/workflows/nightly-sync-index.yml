name: nightly-sync-index

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      source_root:
        description: "Source root containing nightly-tools and nightly-sidequests"
        required: false
        default: "/root/.openclaw/workspace"
      dry_run:
        description: "Run sync in dry-run mode"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show run context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "source_root=${{ github.event.inputs.source_root || '/root/.openclaw/workspace' }}"
          echo "dry_run=${{ github.event.inputs.dry_run || 'false' }}"

      - name: Sync nightly artifacts
        env:
          SOURCE_ROOT: ${{ github.event.inputs.source_root || '/root/.openclaw/workspace' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python3 scripts/sync_nightly.py \
            --source-root "$SOURCE_ROOT" \
            --repo-root "$GITHUB_WORKSPACE" \
            $EXTRA_ARGS

      - name: Rebuild README index + feature pages
        run: |
          set -euo pipefail
          python3 scripts/build_index.py --repo-root "$GITHUB_WORKSPACE"

      - name: Detect changes
        id: detect_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          fi

      - name: Commit updates
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/features archive scripts
          git commit -m "chore: nightly sync + index refresh"

      - name: Push updates
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Final status
        run: |
          echo "Workflow completed. has_changes=${{ steps.detect_changes.outputs.has_changes }}"
