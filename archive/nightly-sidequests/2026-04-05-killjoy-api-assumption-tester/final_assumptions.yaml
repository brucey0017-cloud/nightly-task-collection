# API Assumptions Test File - Final Version
# This file documents assumptions about APIs that we should test regularly

assumptions:
  # GitHub API - Basic availability (adjusted)
  - name: "GitHub API Basic Test"
    url: "https://api.github.com"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "current_user_url"
      - "emojis_url"
      # Note: search_url not present in current API
  
  # JSONPlaceholder - Post endpoint
  - name: "JSONPlaceholder Post Endpoint"
    url: "https://jsonplaceholder.typicode.com/posts/1"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "userId"
      - "id"
      - "title"
      - "body"
  
  # HTTPBin - Basic response structure
  - name: "HTTPBin Get Response"
    url: "https://httpbin.org/get"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "args"
      - "headers"
      - "url"
  
  # HTTPBin - User agent test
  - name: "HTTPBin User Agent Test"
    url: "https://httpbin.org/user-agent"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "user-agent"