# API Assumptions Test File - Corrected Version
# This file documents assumptions about APIs that we should test regularly

assumptions:
  # GitHub API - Basic availability (corrected)
  - name: "GitHub API Basic Test"
    url: "https://api.github.com"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "current_user_url"
      - "emojis_url" 
      - "search_url"
      # Note: zen_url is not always present, removed
  
  # JSONPlaceholder - Post endpoint (corrected)
  - name: "JSONPlaceholder Post Endpoint"
    url: "https://jsonplaceholder.typicode.com/posts/1"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "userId"
      - "id"
      - "title"
      - "body"
  
  # HTTPBin - Basic response structure (corrected)
  - name: "HTTPBin Get Response"
    url: "https://httpbin.org/get"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "args"
      - "headers"
      - "url"
  
  # HTTPBin - User agent test (corrected)
  - name: "HTTPBin User Agent Test"
    url: "https://httpbin.org/user-agent"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "user-agent"
  
  # Public API - Corrected endpoint
  - name: "Public API Random Entry"
    url: "https://api.publicapis.org/random"
    method: "GET"
    expected_status: 200
    expected_keys:
      - "entries"